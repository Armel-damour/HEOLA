<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEOLA - Which One Is Stronger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="topbar">
  <button class="chip" id="sound" aria-pressed="true">🔊 Sound on</button>
</div>

<header>
  <h1><span>HEOLA</span></h1>
  <p class="tagline">WHICH ONE IS STRONGER</p>
</header>

<div class="statbar" id="statbar">
  <div class="stat" id="stStreak"><b>0</b><small>day streak</small></div>
  <div class="stat" id="stTotal"><b>0</b><small>total votes</small></div>
  <div class="stat" id="stFav"><b>-</b><small>your top pick</small></div>
</div>
<div class="goal">
  <div class="bar"><i id="goalBar"></i></div>
  <p id="goalText"></p>
</div>

<div class="roundbar" id="roundbar" aria-live="polite"></div>
<div class="arena" id="arena">
  <button class="side l" id="a"></button>
  <div class="vs" aria-hidden="true">VS</div>
  <button class="side r" id="b"></button>
</div>
<div class="controls">
  <button class="next" id="next">Next matchup</button>
  <p class="hint">Tip: use the left and right arrow keys to vote.</p>
</div>

<section class="champion" id="champion" hidden></section>

<section class="board">
  <h2>Leaderboard</h2>
  <p>Ranked by share of matchups won.</p>
  <div id="list"></div>
  <button class="reset" id="reset">Reset all data</button>
</section>
<footer>Everything is saved in your own browser only.</footer>

<script src="script.js"></script>
</body>
</html>
